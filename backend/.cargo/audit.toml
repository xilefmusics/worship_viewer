# cargo-audit config for backend (see CONTRIBUTING.md).
# Transitive advisories with no upstream fix are ignored here; re-check on dependency upgrades.

[advisories]
ignore = [
    # rsa via openidconnect + surrealdb/jsonwebtoken — no patched release (RUSTSEC-2023-0071)
    "RUSTSEC-2023-0071",
    # h2 0.3 via actix-http — Actix does not yet support the patched h2 0.4 line
    "RUSTSEC-2026-0258",
]
